name: Update formula
on:
  schedule: [{ cron: "17 * * * *" }]
  repository_dispatch: { types: [tappet-release] }
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag (default: latest)", required: false }
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render formula
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if ! gh release view -R tappet-dev/tappet >/dev/null 2>&1; then echo "no release yet"; exit 0; fi
          ./scripts/render-formula.sh "${{ inputs.tag }}"
      - name: Commit
        run: |
          git config user.name "tappet-bot"
          git config user.email "tappet-bot@users.noreply.github.com"
          git add Formula
          git diff --cached --quiet || git commit -m "tappet: update formula" && git push
  audit:
    needs: update
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: |
          [ -f Formula/tappet.rb ] || exit 0
          brew tap-new --no-git local/test && cp Formula/tappet.rb "$(brew --repo local/test)/Formula/"
          brew install local/test/tappet && brew test local/test/tappet
